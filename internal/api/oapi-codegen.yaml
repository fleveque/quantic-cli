# oapi-codegen's settings; run by `go generate ./internal/api` (doc.go).
package: api
output: api.gen.go
generate:
  models: true
  client: true
output-options:
  # The generated client is unexported: commands use Client in client.go.
  client-type-name: genClient
  user-templates:
    imports.tmpl: templates/imports.tmpl
