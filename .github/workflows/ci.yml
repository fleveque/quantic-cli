name: CI

on:
  pull_request:
  push:
    branches: [main]

# Grouped per ref so a push to a branch cancels only that branch's in-flight
# run. A main run is never cancelled by a PR's.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    # `test` is a required check from the start, so the branch protection is
    # final now. Until milestone 1 adds go.mod there is no Go to check, and
    # every Go step is skipped; from then on they all run.
    env:
      HAS_GO: ${{ hashFiles('go.mod') != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: No Go module yet
        if: env.HAS_GO != 'true'
        run: echo "No go.mod yet; the Go checks start with milestone 1."

      - name: Set up Go
        if: env.HAS_GO == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: env.HAS_GO == 'true'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        if: env.HAS_GO == 'true'
        run: go build ./...

      # A CLI is distributed as one static binary per platform: building with
      # cgo off proves no dependency has started needing a C toolchain.
      - name: Build without cgo
        if: env.HAS_GO == 'true'
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        if: env.HAS_GO == 'true'
        run: go vet ./...

      - name: Test
        if: env.HAS_GO == 'true'
        run: go test -race ./...

  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Checks relative links in every Markdown file; external URLs are not
      # fetched.
      - name: Check relative links resolve
        run: |
          fail=0
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            while IFS= read -r link; do
              target="${link%%#*}"
              [ -z "$target" ] && continue
              if [ ! -e "$dir/$target" ]; then
                echo "::error file=$file::broken relative link: $link"
                fail=1
              fi
            done < <(grep -oP '\]\(\K[^)]+' "$file" | grep -Ev '^(https?:|mailto:|#)')
          done < <(find . -name '*.md' -not -path './.git/*')
          exit "$fail"
