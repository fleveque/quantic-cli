name: CI

on:
  pull_request:
  push:
    branches: [main]

# Grouped per ref so a push to a branch cancels only that branch's in-flight
# run. A main run is never cancelled by a PR's.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    # `test` is a required check from the start, so the branch protection is
    # final now. Until milestone 1 adds go.mod there is no Go to check, and
    # every Go step is skipped; from then on they all run. (hashFiles only
    # works inside steps, hence the condition on each one.)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: No Go module yet
        if: hashFiles('go.mod') == ''
        run: echo "No go.mod yet; the Go checks start with milestone 1."

      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: hashFiles('go.mod') != ''
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        if: hashFiles('go.mod') != ''
        run: go build ./...

      # A CLI is distributed as one static binary per platform: building with
      # cgo off proves no dependency has started needing a C toolchain.
      - name: Build without cgo
        if: hashFiles('go.mod') != ''
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        if: hashFiles('go.mod') != ''
        run: go vet ./...

      # internal/api/api.gen.go must be what oapi-codegen makes from
      # api/openapi.json today: a hand edit, or a spec updated without
      # regenerating, fails here.
      - name: Generated code is current
        if: hashFiles('go.mod') != ''
        run: |
          go generate ./...
          if ! git diff --exit-code; then
            echo "::error::go generate ./... changed the files above; run it and commit the result."
            exit 1
          fi

      - name: Test
        if: hashFiles('go.mod') != ''
        run: go test -race ./...

      # The release, built but not published: every platform, the archives,
      # the AUR package and the Homebrew cask, so a change that would break
      # the next release fails here instead of on the tag.
      - name: Release builds
        if: hashFiles('.goreleaser.yaml') != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean
        env:
          AUR_KEY: unused-in-a-snapshot
          HOMEBREW_TAP_TOKEN: unused-in-a-snapshot

      # The -X flags reached main's variables: a release says its version,
      # not a pseudo-version or "(devel)".
      - name: Release binary knows its version
        if: hashFiles('.goreleaser.yaml') != ''
        run: |
          got="$(dist/quantic_linux_amd64_v1/quantic version --json | jq -r .version)"
          want="v$(jq -r .version dist/metadata.json)"
          echo "binary: $got, release: $want"
          [ "$got" = "$want" ]

  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Checks relative links in every Markdown file; external URLs are not
      # fetched. Fenced and inline code are skipped first: Go code is full of
      # `](`, as in errors.AsType[*ExitError](err), and none of it is a link.
      - name: Check relative links resolve
        run: |
          fail=0
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            while IFS= read -r link; do
              target="${link%%#*}"
              [ -z "$target" ] && continue
              if [ ! -e "$dir/$target" ]; then
                echo "::error file=$file::broken relative link: $link"
                fail=1
              fi
            done < <(sed '/^```/,/^```/d; s/`[^`]*`//g' "$file" | grep -oP '\]\(\K[^)]+' | grep -Ev '^(https?:|mailto:|#)')
          done < <(find . -name '*.md' -not -path './.git/*')
          exit "$fail"
